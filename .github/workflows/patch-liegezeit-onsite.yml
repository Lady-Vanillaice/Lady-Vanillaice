name: Patch Liegezeit onsite amount

on:
  push:
    branches:
      - fix/liegezeit-onsite-amount

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liegezeit-onsite-amount
          fetch-depth: 0
      - name: Patch source
        run: python .github/patch_liegezeit_onsite.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/admin-shared.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Liegezeit onsite payment amount"
          git push origin HEAD:fix/liegezeit-onsite-amount
