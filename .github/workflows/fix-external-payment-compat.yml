name: Fix external booking payment compatibility

on:
  push:
    branches:
      - fix/external-booking-payment-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-booking-payment-compat
          fetch-depth: 0
      - name: Store external on-site payment in initial booking write
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          // 1) Manual/external booking form: pass onsite details directly to createManualBooking.
          {
            const path = 'src/components/admin/admin-shared.tsx';
            let text = readFileSync(path, 'utf8');
            text = text.replace('import { useServerFn } from "@tanstack/react-start";\n', '');
            text = text.replace('import { updateBookingOnsitePaymentBySlot } from "@/lib/rest-payment.functions";\n', '');
            text = text.replace(
              '  deposit_exemption_reason: "regular_customer" | "trust" | "exception" | "colleague_guarantees" | "spontaneous" | null;\n};',
              '  deposit_exemption_reason: "regular_customer" | "trust" | "exception" | "colleague_guarantees" | "spontaneous" | null;\n  onsite_method: string | null;\n  onsite_paid_at: string | null;\n};'
            );
            text = text.replace('  const updateOnsitePaymentBySlotFn = useServerFn(updateBookingOnsitePaymentBySlot);\n', '');
            text = text.replace(
              '        deposit_exemption_reason: depositExemptionReason,\n      });\n\n      if (created && typeof created === "object" && "slot_id" in created) {\n        const slotId = (created as { slot_id?: unknown }).slot_id;\n        if (typeof slotId === "string") {\n          await updateOnsitePaymentBySlotFn({ data: { slot_id: slotId, amount: Math.max(0, total - (depositExemptionReason ? 0 : deposit)), method: onsiteMethod.trim() || null, paid_at: onsitePaidAt || null } });\n        }\n      }',
              '        deposit_exemption_reason: depositExemptionReason,\n        onsite_method: onsiteMethod.trim() || null,\n        onsite_paid_at: onsitePaidAt || null,\n      });'
            );
            text = text.replace('      const created = await onCreate({', '      await onCreate({');
            if (text.includes('updateOnsitePaymentBySlotFn') || !text.includes('onsite_method: onsiteMethod.trim() || null')) {
              throw new Error('External form compatibility patch incomplete.');
            }
            writeFileSync(path, text);
          }

          // 2) Server create: save payment date directly; use existing anzahlung_method for no-deposit onsite method.
          {
            const path = 'src/lib/booking.functions.ts';
            let text = readFileSync(path, 'utf8');
            text = text.replace(
              '  deposit_exemption_reason: z.enum(["regular_customer", "trust", "exception", "colleague_guarantees", "spontaneous"]).nullable(),\n});',
              '  deposit_exemption_reason: z.enum(["regular_customer", "trust", "exception", "colleague_guarantees", "spontaneous"]).nullable(),\n  onsite_method: z.string().trim().min(1).max(100).nullable(),\n  onsite_paid_at: z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/).nullable(),\n});'
            );
            text = text.replace(
              '    const combinedInternalNote = [\n      data.preferences ? `Vorlieben & Wünsche:\\n${data.preferences}` : null,\n      data.taboos ? `Tabus & Grenzen:\\n${data.taboos}` : null,\n      data.health_notes ? `Gesundheitliche Hinweise:\\n${data.health_notes}` : null,\n      data.internal_note ? `Weitere Notiz:\\n${data.internal_note}` : null,\n    ].filter(Boolean).join("\\n\\n") || null;',
              '    const combinedInternalNote = [\n      data.preferences ? `Vorlieben & Wünsche:\\n${data.preferences}` : null,\n      data.taboos ? `Tabus & Grenzen:\\n${data.taboos}` : null,\n      data.health_notes ? `Gesundheitliche Hinweise:\\n${data.health_notes}` : null,\n      data.internal_note ? `Weitere Notiz:\\n${data.internal_note}` : null,\n      data.onsite_method ? `Vor Ort Zahlungsmethode: ${data.onsite_method}` : null,\n    ].filter(Boolean).join("\\n\\n") || null;'
            );
            text = text.replace(
              '        anzahlung_method: data.deposit_exemption_reason ? null : data.deposit_method,',
              '        anzahlung_method: data.deposit_exemption_reason ? data.onsite_method : data.deposit_method,'
            );
            text = text.replace(
              '        bar: data.total_amount - (data.deposit_exemption_reason ? 0 : data.deposit_amount),\n        fully_paid: !data.deposit_exemption_reason && data.total_amount === data.deposit_amount,',
              '        bar: data.total_amount - (data.deposit_exemption_reason ? 0 : data.deposit_amount),\n        cash_received_at: data.onsite_paid_at ? `${data.onsite_paid_at}T12:00:00.000Z` : null,\n        fully_paid: Boolean(data.onsite_paid_at) || (!data.deposit_exemption_reason && data.total_amount === data.deposit_amount),'
            );
            if (!text.includes('onsite_paid_at: z.string()') || !text.includes('cash_received_at: data.onsite_paid_at') || !text.includes('Vor Ort Zahlungsmethode: ${data.onsite_method}')) {
              throw new Error('Manual booking server compatibility patch incomplete.');
            }
            writeFileSync(path, text);
          }

          // 3) Cashbook: recover the separate onsite method from the existing admin note for deposit+onsite bookings.
          {
            const path = 'src/lib/cashbook.functions.ts';
            let text = readFileSync(path, 'utf8');
            text = text.replace(
              '      const cashDate = dateOnly(b.cash_received_at) ?? (b.fully_paid ? dateOnly(b.completed_at) : null);',
              '      const cashDate = dateOnly(b.cash_received_at) ?? (b.fully_paid ? dateOnly(b.completed_at) : null);\n      const onsiteMethodFromNote = typeof b.admin_note === "string" ? b.admin_note.match(/(?:^|\\n)Vor Ort Zahlungsmethode:\\s*([^\\n]+)/)?.[1]?.trim() ?? null : null;'
            );
            text = text.replace(
              '        restbetrag_vorgemerkt: plannedCash, restzahlung_method: b.deposit_exemption_reason || plannedDeposit === 0 ? b.anzahlung_method ?? null : null,',
              '        restbetrag_vorgemerkt: plannedCash, restzahlung_method: onsiteMethodFromNote ?? (b.deposit_exemption_reason || plannedDeposit === 0 ? b.anzahlung_method ?? null : plannedCash > 0 ? "Bar" : null),'
            );
            if (!text.includes('onsiteMethodFromNote') || !text.includes('restzahlung_method: onsiteMethodFromNote')) {
              throw new Error('Cashbook onsite-method compatibility patch incomplete.');
            }
            writeFileSync(path, text);
          }
          NODE
      - name: Commit direct source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Save external onsite payment without missing database column"
          git push origin HEAD:fix/external-booking-payment-compat
