name: Fix public calendar availability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-public-calendar-availability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch availability windows and status
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          backend = Path('src/lib/public-booking.functions.ts')
          s = backend.read_text()

          old = '''    let hasFree = false;
    for (let t = winStart; t + MIN_DURATION_MS <= winEnd; t += STEP_MS) {
      if (t < nowMs) continue;
      const reqEnd = t + MIN_DURATION_MS;
      const conflict = busyRanges.some((b) => t < b.e && reqEnd > b.s);
      if (!conflict) {
        hasFree = true;
        break;
      }
    }

    return { ...slot, is_fully_booked: !hasFree, has_booking: hasBooking, is_reserved: false, reserved_until: null as string | null };
'''
          new = '''    // Build the actual remaining free windows instead of returning the original
    // released slot boundaries. This keeps the text list in sync with the
    // occupancy timeline and with the booking conflict rules (including buffer).
    const mergedBusy: Array<{ s: number; e: number }> = [];
    for (const range of [...busyRanges].sort((a, b) => a.s - b.s)) {
      const s = Math.max(range.s, winStart);
      const e = Math.min(range.e, winEnd);
      if (e <= s) continue;
      const last = mergedBusy[mergedBusy.length - 1];
      if (last && s <= last.e) {
        last.e = Math.max(last.e, e);
      } else {
        mergedBusy.push({ s, e });
      }
    }

    const freeWindows: Array<typeof slot & { is_fully_booked: boolean }> = [];
    const firstPossibleStart = Math.ceil(Math.max(winStart, nowMs) / STEP_MS) * STEP_MS;
    let cursor = firstPossibleStart;

    const addFreeWindow = (start: number, end: number) => {
      if (end - start < STEP_MS) return;
      freeWindows.push({
        ...slot,
        id: `${slot.id}-free-${freeWindows.length}`,
        starts_at: new Date(start).toISOString(),
        ends_at: new Date(end).toISOString(),
        is_fully_booked: false,
      });
    };

    for (const range of mergedBusy) {
      if (range.e <= cursor) continue;
      if (range.s > cursor) addFreeWindow(cursor, Math.min(range.s, winEnd));
      cursor = Math.max(cursor, range.e);
      if (cursor >= winEnd) break;
    }
    if (cursor < winEnd) addFreeWindow(cursor, winEnd);

    const hasFree = freeWindows.some(
      (window) => new Date(window.ends_at).getTime() - new Date(window.starts_at).getTime() >= MIN_DURATION_MS,
    );

    return {
      ...slot,
      free_windows: freeWindows,
      is_fully_booked: !hasFree,
      has_booking: hasBooking,
      is_reserved: false,
      reserved_until: null as string | null,
    };
'''
          if old not in s:
              raise SystemExit('Backend availability anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const starts = daySlots.map((s) => new Date(s.starts_at).getTime());
    const ends = daySlots.map((s) => new Date(s.ends_at).getTime());
    const duoSlot = daySlots.find((s) => s.is_duo);
    return {
      ...slot,
      starts_at: new Date(Math.min(...starts)).toISOString(),
      ends_at: new Date(Math.max(...ends)).toISOString(),
      windows: daySlots.map((s) => ({
        id: s.id,
        starts_at: s.starts_at,
        ends_at: s.ends_at,
        location: s.location,
        buffer_minutes: s.buffer_minutes,
        status: s.status,
        is_duo: s.is_duo,
        is_content_shoot: s.is_content_shoot,
        duo_partner: s.duo_partner,
        is_fully_booked: s.is_fully_booked,
      })),
'''
          new = '''    const freeDayWindows = daySlots.flatMap((s) => s.free_windows);
    const visibleWindows = freeDayWindows.length ? freeDayWindows : daySlots;
    const starts = visibleWindows.map((s) => new Date(s.starts_at).getTime());
    const ends = visibleWindows.map((s) => new Date(s.ends_at).getTime());
    const duoSlot = daySlots.find((s) => s.is_duo);
    return {
      ...slot,
      starts_at: new Date(Math.min(...starts)).toISOString(),
      ends_at: new Date(Math.max(...ends)).toISOString(),
      windows: freeDayWindows.map((s) => ({
        id: s.id,
        starts_at: s.starts_at,
        ends_at: s.ends_at,
        location: s.location,
        buffer_minutes: s.buffer_minutes,
        status: s.status,
        is_duo: s.is_duo,
        is_content_shoot: s.is_content_shoot,
        duo_partner: s.duo_partner,
        is_fully_booked: s.is_fully_booked,
      })),
'''
          if old not in s:
              raise SystemExit('Backend day-window anchor not found')
          s = s.replace(old, new, 1)
          backend.write_text(s)

          frontend = Path('src/routes/kalender.tsx')
          s = frontend.read_text()

          old = '''  const windowDurations = windows.map((w) => Math.round((new Date(w.ends_at).getTime() - new Date(w.starts_at).getTime()) / 60_000));
  const longestWindowMinutes = Math.max(...windowDurations, 30);
'''
          new = '''  const windowDurations = windows.map((w) => Math.round((new Date(w.ends_at).getTime() - new Date(w.starts_at).getTime()) / 60_000));
  const longestWindowMinutes = Math.max(...windowDurations, 30);
  const totalFreeMinutes = windowDurations.reduce((sum, minutes) => sum + minutes, 0);
  const availabilityLabel = slot.has_booking
    ? totalFreeMinutes <= 180
      ? tr("Fast ausgebucht", "Almost fully booked")
      : tr("Teilweise verfügbar", "Partly available")
    : tr("Verfügbar", "Available");
'''
          if old not in s:
              raise SystemExit('Frontend duration anchor not found')
          s = s.replace(old, new, 1)

          old = '<span>{tr("Verfügbar", "Available")}</span>'
          new = '<span>{availabilityLabel}</span>'
          if old not in s:
              raise SystemExit('Frontend label anchor not found')
          s = s.replace(old, new, 1)
          frontend.write_text(s)
          PY

          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/public-booking.functions.ts src/routes/kalender.tsx
          git commit -m "fix: show actual remaining calendar availability"
          git push origin HEAD:main
