name: Patch admin schedule override

on:
  push:
    branches:
      - fix/admin-schedule-override

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-schedule-override
          fetch-depth: 0
      - name: Patch source
        run: python .github/patch_schedule_override_no_open_slot.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/booking.functions.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Allow admin schedule overrides outside open slots"
          git push origin HEAD:fix/admin-schedule-override
