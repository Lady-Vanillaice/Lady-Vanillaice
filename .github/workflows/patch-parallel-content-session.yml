name: Patch parallel content and session

on:
  push:
    branches:
      - fix/parallel-content-and-session

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/parallel-content-and-session
          fetch-depth: 0
      - name: Patch source
        run: python .github/patch_parallel_content.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/booking.functions.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Allow content and session appointments in parallel"
          git push origin HEAD:fix/parallel-content-and-session
