name: Fix travel log times and duplicates

on:
  push:
    branches:
      - fix/travel-log-times-and-dedup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/travel-log-times-and-dedup
          fetch-depth: 0
      - name: Patch source directly
        run: python .github/patch_travel_log.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/admin.kassenbuch.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Improve travel log times and daily grouping"
          git push origin HEAD:fix/travel-log-times-and-dedup
